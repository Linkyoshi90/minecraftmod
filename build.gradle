plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// The short git commit, shown after the version in the Mods screen (0.2.0+332651b) so two builds
// of the same version can be told apart. "+dirty" marks a build with uncommitted changes.
// Without git (or outside a checkout) it is just the plain version.
def gitStamp = providers.provider {
    try {
        def hash = providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD'; ignoreExitValue = true }
                .standardOutput.asText.get().trim()
        if (!hash) return ''
        def dirty = providers.exec { commandLine 'git', 'status', '--porcelain', '--untracked-files=no'; ignoreExitValue = true }
                .standardOutput.asText.get().trim()
        return '+' + hash + (dirty ? '.dirty' : '')
    } catch (Exception ignored) {
        return ''
    }
}
def displayVersion = "${mod_version}${gitStamp.get()}"

// ./gradlew bumpVersion [-Ppart=patch|minor|major] raises mod_version in gradle.properties.
tasks.register('bumpVersion') {
    def propsFile = file('gradle.properties')
    def part = providers.gradleProperty('part').orElse('patch')
    doLast {
        def text = propsFile.getText('UTF-8')
        def m = text =~ /(?m)^mod_version=(\d+)\.(\d+)\.(\d+)\s*$/
        if (!m.find()) throw new GradleException('mod_version=X.Y.Z not found in gradle.properties')
        int major = m.group(1) as int, minor = m.group(2) as int, patch = m.group(3) as int
        switch (part.get()) {
            case 'major': major++; minor = 0; patch = 0; break
            case 'minor': minor++; patch = 0; break
            case 'patch': patch++; break
            default: throw new GradleException("part must be patch, minor or major, not ${part.get()}")
        }
        def next = "${major}.${minor}.${patch}"
        propsFile.write(text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${next}"), 'UTF-8')
        println "mod_version ${m.group(1)}.${m.group(2)}.${m.group(3)} -> ${next}"
    }
}

sourceSets {
    paints {
        java.srcDirs = []
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_paints" {
            sourceSet(sourceSets.paints)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Jade (optional): our tooltip lines for pregnancy and friendship (compat/JadePlugin); in the dev client too
    compileOnly "maven.modrinth:jade:${jade_version}"
    // TaCZ (optional, the unofficial NeoForge port): befriended fighters can carry and fire its guns (compat/TaczCompat)
    compileOnly "maven.modrinth:tacz-1.21.1:${tacz_version}"
    // not on the game test server: Jade greets every joining player, and the tests' fake players cannot take its packet
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }) {
        localRuntime "maven.modrinth:jade:${jade_version}"
    }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : displayVersion,
            geckolib_version       : geckolib_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
var generatePaintsMetadata = tasks.register("generatePaintsMetadata", ProcessResources) {
    var replaceProperties = [
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/paints/templates"
    into "build/generated/sources/paintsMetadata"
}
sourceSets.paints.resources.srcDir generatePaintsMetadata
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// The optional paints jar: just the paint textures (src/paints, written by tools/gen_paints.py), far too many for the main jar.
var paintsJar = tasks.register("paintsJar", Jar) {
    from sourceSets.paints.output
    archiveBaseName = "${mod_id}-paints"
    zip64 = true // more than the 65535 entries a plain zip can hold
}
tasks.named("assemble") { dependsOn paintsJar }

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Server safety (2026-11-10): no class a dedicated server loads may name a client-only class. Scans the compiled classes'
// constant pools for vanilla client, Blaze3D, NeoForge client, GeckoLib renderer/model classes and this mod's own client package.
// Classes in our client package are skipped (only loaded on the client); each allowed exception says why it is safe.
// Runs with `check` and before every GameTest run.
var checkServerSafe = tasks.register("checkServerSafe") {
    var classesDir = layout.buildDirectory.dir("classes/java/main")
    dependsOn "compileJava"
    inputs.dir(classesDir)
    doLast {
        def allowed = [
            "com/linkyoshi90/harmontide/HarmontideMod": "HarmontideClientConfig is a plain ModConfigSpec holder, safe on a server",
            "com/linkyoshi90/harmontide/network/ModPayloads": "client classes only inside playToClient handlers, which never run on a server",
            "com/linkyoshi90/harmontide/item/WingedCapItem\$1": "GeckoLib's render provider, created only by createGeoRenderer on the client",
            "com/linkyoshi90/harmontide/item/HeadgearItem\$1": "the same render provider, for the headgear friends give",
        ]
        def pattern = ~/(?:net\/minecraft\/client|com\/mojang\/blaze3d|net\/neoforged\/neoforge\/client|software\/bernie\/geckolib\/(?:renderer|model|cache\/object)|com\/linkyoshi90\/harmontide\/client)\/[A-Za-z0-9_\/\$]+/
        def root = classesDir.get().asFile
        def leaks = []
        root.eachFileRecurse { f ->
            if (!f.name.endsWith(".class")) return
            def name = root.toPath().relativize(f.toPath()).toString().replace(File.separator, "/") - ~/\.class$/
            if (name.contains("/client/") || allowed.containsKey(name)) return
            def refs = (new String(f.bytes, "ISO-8859-1") =~ pattern).collect { it }.unique().sort()
            if (!refs.isEmpty()) leaks << "${name} -> ${refs.join(', ')}"
        }
        if (!leaks.isEmpty()) {
            throw new GradleException("Client-only classes named in server code (a dedicated server would crash loading them):\n  " + leaks.join("\n  ")
                    + "\nMove the code into the client package, or (if it only runs on the client) add the class to checkServerSafe's allowed list with why.")
        }
        logger.lifecycle("checkServerSafe: no client-only class named outside the client package (${allowed.size()} allowed exceptions)")
    }
}
tasks.named("check") { dependsOn checkServerSafe }
tasks.matching { it.name == "runGameTestServer" }.configureEach { dependsOn checkServerSafe }
